<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felvan Talks</title>
<link rel="icon" href="https://iili.io/CYBXpR4.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e3;--bg2:#ffe9b8;--card:#fff;--ink:#2b1606;--mute:#8a6a4a;--line:#f6dba5;--sun:#ffc21a;--orange:#ff7a1a;--burn:#d9480f;--grad:linear-gradient(135deg,#ffc21a,#ff7a1a);--shadow:0 8px 24px rgba(217,72,15,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1208;--bg2:#2a1a0a;--card:#2a1c0e;--ink:#fff1d6;--mute:#c9a577;--line:#4a3014;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Outfit,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 85% -10%,rgba(255,194,26,.45),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(255,122,26,.3),transparent 60%),var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.app{flex:1;display:flex;flex-direction:column;width:100%;max-width:820px;margin:0 auto;min-height:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:10px}

header{padding:16px 18px 8px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;animation:float 4s ease-in-out infinite}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
.logo b{display:none;color:#fff;font-weight:800;font-size:1.4rem}
.logo.nologo{background:var(--grad);box-shadow:0 6px 16px rgba(255,122,26,.45)}
.logo.nologo b{display:block}
@keyframes float{50%{transform:translateY(-3px) rotate(-4deg)}}
h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-right:auto;line-height:1}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font-size:.72rem;font-weight:500;color:var(--mute);margin-top:4px;letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px}

.levels{display:flex;gap:6px;padding:4px 18px 10px;overflow-x:auto;scrollbar-width:none}
.levels button{padding:7px 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;transition:.2s;flex:none}
.levels button:hover{transform:translateY(-2px)}
.levels button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(255,122,26,.4)}

#key-row{display:none;margin:0 18px 8px;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);gap:8px;flex-wrap:wrap}
#key-row.open{display:flex}
#key-row input{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:transparent}
#key-row small{width:100%;color:var(--mute);font-size:.78rem}
.btn{background:var(--grad);color:#fff;font-weight:700;padding:10px 18px;border-radius:12px;box-shadow:0 6px 14px rgba(255,122,26,.35)}

main{flex:1;overflow-y:auto;padding:8px 18px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.hero{margin:auto;text-align:center;max-width:460px;padding:10px}
.hero .big{font-size:3.2rem;animation:float 3s ease-in-out infinite}
.hero h2{font-size:1.7rem;margin:6px 0;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--mute);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:9px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:500;transition:.2s}
.chips button:hover{background:var(--sun);color:#2b1606;border-color:var(--sun);transform:translateY(-2px)}

.row{display:flex;gap:10px;align-items:flex-end;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.row.me{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.msg{max-width:84%;padding:12px 16px;border-radius:20px;line-height:1.5}
.me .msg{background:var(--grad);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 18px rgba(255,122,26,.35);font-weight:500}
.ai .msg{background:var(--card);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.say{margin-left:6px;font-size:15px;vertical-align:middle;opacity:.8}
.say:hover{opacity:1;transform:scale(1.15)}

.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-7px);background:var(--sun)}}

.fb{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line);display:grid;gap:10px;font-size:.92rem}
.score{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:--p 1s}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.9rem}
.praise{color:var(--mute)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:6px}
.tag.g{background:#ffe1c9;color:var(--burn)}.tag.p{background:#fff0b3;color:#8a5a00}
@media(prefers-color-scheme:dark){.tag.g{background:#5a2a0e;color:#ffb27a}.tag.p{background:#5a470a;color:#ffd75e}}
.item{padding:10px 12px;border-radius:14px;background:var(--bg);margin-bottom:6px}
.item del{color:var(--burn);opacity:.8}.item ins{text-decoration:none;font-weight:700;color:#d96a00}
.item p{margin:4px 0 0;color:var(--mute)}
.ipa{background:var(--sun);color:#2b1606;border-radius:8px;padding:1px 8px;font-weight:600;margin:0 4px}

footer{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--card);padding:8px;border-radius:28px;box-shadow:var(--shadow);border:1.5px solid var(--line)}
textarea{flex:1;border:0;background:transparent;resize:none;padding:10px 8px;max-height:120px;min-height:44px;outline:0}
.mic,.send{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;transition:.2s}
.mic{background:var(--bg2)}
.mic.rec{background:var(--burn);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,72,15,.55)}100%{box-shadow:0 0 0 16px rgba(217,72,15,0)}}
.send{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(255,122,26,.4)}
.send:hover:not(:disabled){transform:scale(1.08) rotate(-8deg)}
.send:disabled{opacity:.5}
.listen{display:none;align-items:center;gap:3px;height:48px;padding:0 8px}
.rec-on .listen{display:flex}.rec-on textarea{display:none}
.listen i{width:4px;border-radius:3px;background:var(--orange);animation:wave 0.9s ease-in-out infinite}
.listen i:nth-child(odd){background:var(--sun)}
.listen i:nth-child(1){animation-delay:0s}.listen i:nth-child(2){animation-delay:.1s}.listen i:nth-child(3){animation-delay:.2s}.listen i:nth-child(4){animation-delay:.3s}.listen i:nth-child(5){animation-delay:.15s}.listen i:nth-child(6){animation-delay:.25s}.listen i:nth-child(7){animation-delay:.05s}
@keyframes wave{0%,100%{height:6px}50%{height:28px}}
.listen span{margin-left:8px;color:var(--mute);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><img src="https://iili.io/CYBXpR4.png" alt="Felvan Course" onerror="this.parentNode.classList.add('nologo');this.remove()"><b>F</b></div>
  <h1><span>Felvan</span> Talks<small>by Felvan Course</small></h1>
  <button class="icon-btn" id="btn-key" type="button" aria-label="Ubah nama">⚙️</button>
</header>

<div id="key-row">
  <input id="key" type="text" placeholder="Nama kamu" autocomplete="name" maxlength="40">
  <button class="btn" id="save-key" type="button">Simpan</button>
  <small>Namamu dipakai untuk mencatat progres belajar.</small>
</div>

<nav class="levels" id="levels" aria-label="Level CEFR"></nav>

<main id="chat" aria-live="polite">
  <section class="hero" id="empty">
    <div class="big">💬</div>
    <h2>Mau ngobrol apa hari ini?</h2>
    <p>Ketik atau bicara pakai mikrofon. Felvan membalas, mengoreksi grammar, dan membantu pelafalanmu.</p>
    <div class="chips" id="starters"></div>
  </section>
</main>

<footer>
  <div class="bar" id="bar">
    <button class="mic" id="mic" type="button" aria-label="Rekam suara">🎤</button>
    <div class="listen" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><span>Mendengarkan…</span></div>
    <textarea id="input" rows="1" placeholder="Write or speak in English…"></textarea>
    <button class="send" id="send" type="button" aria-label="Kirim">➤</button>
  </div>
</footer>
</div>

<script>
const MODEL = "gemini-2.5-flash";
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), micBtn = $("mic");
let history = [], heardWords = null, busy = false, level = "B1";

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
$("key").value = store("ft_name") || "";
level = store("ft_level") || "B1";
$("btn-key").onclick = () => $("key-row").classList.toggle("open");
$("save-key").onclick = () => { store("ft_name", $("key").value.trim()); $("key-row").classList.remove("open"); };
if(!$("key").value) $("key-row").classList.add("open");

/* level chips */
const lv = $("levels");
["A1","A2","B1","B2","C1","C2"].forEach(l => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = l; b.className = l===level ? "on" : "";
  b.onclick = () => { level = l; store("ft_level", l); [...lv.children].forEach(c => c.classList.toggle("on", c===b)); };
  lv.appendChild(b);
});

/* starter topics */
["☕ Order a coffee","✈️ At the airport","💼 Job interview","🍜 My favorite food","🎬 Talk about movies"].forEach(t => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = t;
  b.onclick = () => { input.value = "Let's practice: " + t.slice(2); send(); };
  $("starters").appendChild(b);
});

async function askGemini(text, words){
  const userPart = words ? `${text}

speech_words: ${JSON.stringify(words)}` : text;
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({level, contents:[...history,{role:"user",parts:[{text:userPart}]}]})
  });
  const out = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(out.error || `Server error ${res.status}`);
  history.push({role:"user",parts:[{text:userPart}]},{role:"model",parts:[{text:out.reply||""}]});
  history = history.slice(-20);
  return out;
}

function saveLog(text, o){
  fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user:$("key").value.trim()||"Guest", level, text, reply:o.reply, score:o.score,
      corrections:o.corrections||[], pronunciation:o.pronunciation||[]})}).catch(()=>{});
}

const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function add(who, html){
  $("empty")?.remove();
  const r = document.createElement("div");
  r.className = "row " + who;
  r.innerHTML = (who==="ai" ? `<div class="av" aria-hidden="true">F</div>` : "") + `<div class="msg">${html}</div>`;
  chat.appendChild(r);
  chat.scrollTop = chat.scrollHeight;
  return r.querySelector(".msg");
}

function feedbackHtml(o){
  let h = "";
  if(typeof o.score==="number") h += `<div class="score"><div class="ring" style="--p:${Math.round(o.score)}"><b>${Math.round(o.score)}</b></div><div class="praise">${esc(o.praise||"")}</div></div>`;
  if(o.corrections?.length) h += `<div><span class="tag g">Grammar</span>` + o.corrections.map(c =>
    `<div class="item"><del>${esc(c.original)}</del> → <ins>${esc(c.corrected)}</ins><p>${esc(c.explanation)}</p></div>`).join("") + `</div>`;
  if(o.pronunciation?.length) h += `<div><span class="tag p">Pronunciation</span>` + o.pronunciation.map(p =>
    `<div class="item"><b>${esc(p.word)}</b><span class="ipa">${esc(p.ipa)}</span><button class="say" type="button" data-say="${esc(p.word)}" aria-label="Dengar ${esc(p.word)}">🔊</button><p>${esc(p.tip)}</p></div>`).join("") + `</div>`;
  return h ? `<div class="fb">${h}</div>` : "";
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  speechSynthesis.speak(u);
}
chat.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if(b) speak(b.dataset.say);
  const r = e.target.closest("[data-reply]"); if(r) speak(r.dataset.reply);
});

async function send(){
  const text = input.value.trim();
  if(!text || busy) return;
  busy = true; $("send").disabled = true;
  input.value = ""; input.style.height = "";
  const words = heardWords; heardWords = null;
  add("me", esc(text));
  const wait = add("ai", `<span class="dots"><i></i><i></i><i></i></span>`);
  try{
    const o = await askGemini(text, words);
    saveLog(text, o);
    wait.innerHTML = `${esc(o.reply)}<button class="say" type="button" data-reply="${esc(o.reply)}" aria-label="Dengar balasan">🔊</button>` + feedbackHtml(o);
    speak(o.reply);
  }catch(err){
    wait.innerHTML = `<span style="color:var(--burn)">${esc(err.message)}</span>`;
  }
  busy = false; $("send").disabled = false;
  chat.scrollTop = chat.scrollHeight;
}
$("send").onclick = send;
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight,120)+"px"; });

/* mikrofon */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recOff(){ micBtn.classList.remove("rec"); $("bar").classList.remove("rec-on"); micBtn.textContent = "🎤"; }
if(!SR){ micBtn.disabled = true; micBtn.title = "Gunakan Chrome atau Edge untuk fitur suara."; micBtn.style.opacity = .5; }
else{
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    const alt = e.results[0][0];
    input.value = alt.transcript;
    heardWords = alt.transcript.split(/\s+/).map(w => ({word:w, confidence:+alt.confidence.toFixed(2)}));
    send();
  };
  rec.onend = recOff;
  rec.onerror = e => { recOff(); if(e.error==="not-allowed") alert("Izinkan akses mikrofon di browser."); };
  micBtn.onclick = () => {
    if(micBtn.classList.contains("rec")){ rec.stop(); return; }
    speechSynthesis.cancel();
    micBtn.classList.add("rec"); $("bar").classList.add("rec-on"); micBtn.textContent = "⏹";
    rec.start();
  };
}
</script>
</body>
</html>
